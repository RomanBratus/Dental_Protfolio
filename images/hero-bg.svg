<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 600 400">
  <g fill="none" stroke="#ccc" stroke-width="2" opacity="0.1">
    <!-- braces -->
    <rect x="50" y="50" width="100" height="60" rx="10"/>
    <rect x="70" y="30" width="20" height="20"/>
    <rect x="110" y="30" width="20" height="20"/>
    <line x1="80" y1="80" x2="120" y2="80"/>
    <!-- tooth -->
    <path d="M250,50 L300,30 L350,50 L350,100 L330,110 L270,110 L250,100 Z"/>
    <!-- TMJ / СНЩС -->
    <circle cx="450" cy="80" r="20"/>
    <circle cx="450" cy="120" r="30"/>
    <!-- intraoral scanner -->
    <rect x="50" y="200" width="30" height="80"/>
    <path d="M65,200 L80,180 L80,280 L65,280 Z"/>
    <!-- lateral cephalometry (simplified head profile) -->
    <circle cx="250" cy="300" r="60"/>
    <line x1="250" y1="240" x2="260" y2="220"/>
    <line x1="250" y1="360" x2="240" y2="380"/>
    <!-- Gamma Reference articulator (simplified hinge) -->
    <path d="M400,300 Q420,250 440,300"/>
    <path d="M400,340 Q420,290 440,340"/>
    <line x1="420" y1="250" x2="420" y2="290"/>
  </g>
</svg>