name: Send Telegram Notification

on:
  push:
    paths:
      - 'js/main.js'
      - 'js/quiz.js'
      - 'netlify/functions/telegram.js'
      - 'netlify.toml'
      - 'index.html'
      - 'css/style.css'

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse Telegram Config
        id: telegram-config
        run: |
          BOT_TOKEN="8717914768:AAEWpxMjbItLrUiG7FytiZ_TNt0shBHiUCg"
          CHAT_ID="-5024101596"
          echo "bot_token=$BOT_TOKEN" >> $GITHUB_OUTPUT
          echo "chat_id=$CHAT_ID" >> $GITHUB_OUTPUT

      - name: Create message from build artifacts
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          GIT_AUTHOR="${{ github.actor }}"

          # Create a simple notification message
          cat > notification.txt << EOF
📝 Notification from GitHub Actions
========================================

🕐 Time: $TIMESTAMP
👤 Author: $GIT_AUTHOR
📂 Repository: ${{ github.repository }}
🔗 Commit: ${{ github.sha }}

✨ Build completed successfully!

📝 Key changes:
- Updated Telegram webhook configuration
- Enhanced error handling in main.js
- Fixed Netlify.toml syntax

📍 Context:
This notification is sent automatically when the project is built and pushed to the main branch.
EOF

      - name: Send to Telegram
        uses: actions/github-script@v7
        with:
          script: |
            const botToken = process.env.GITHUB_BOT_TOKEN || '8717914768:AAEWpxMjbItLrUiG7FytiZ_TNt0shBHiUCg';
            const chatId = process.env.GITHUB_CHAT_ID || '-5024101596';
            const message = require('fs').readFileSync('notification.txt', 'utf8');

            const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                chat_id: chatId,
                text: message,
                parse_mode: 'HTML',
                disable_web_page_preview: true,
              })
            });

            const result = await response.json();
            if (!result.ok) {
              console.error('Telegram API error:', result);
              core.setFailed(`Failed to send notification to Telegram: ${result.description}`);
            } else {
              console.log('Notification sent to Telegram successfully');
            }

      - name: Clean up
        run: |
          rm -f notification.txt

  # Dummy job to prevent "No jobs were run" warning
  dummy:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: echo "Dummy job to avoid 'No jobs were run' warning"
